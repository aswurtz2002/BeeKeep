name: BeeKeep Android debug build
# Avoid a queue of obsolete runs after rapid branch updates.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run unit tests and lint (debug)
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Print debug lint report on failure
        if: failure()
        shell: bash
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "----- $report -----"
            cat "$report"
          fi
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beekeep-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
