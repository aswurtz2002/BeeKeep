name: BeeKeep trusted-device Edge Function checks
on:
  push:
    paths:
      - 'supabase/functions/beekeep-device-access/**'
      - '.github/workflows/device-access-function.yml'
  pull_request:
    paths:
      - 'supabase/functions/beekeep-device-access/**'
      - '.github/workflows/device-access-function.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check trusted-device Edge Function
        run: deno check supabase/functions/beekeep-device-access/index.ts
      - name: Test ECDSA proof and challenge verification helpers
        run: deno test supabase/functions/beekeep-device-access/crypto_test.ts
